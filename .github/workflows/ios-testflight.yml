name: iOS → TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode 26 (Apple requires the iOS 26 SDK)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "::error::No Xcode 26 on this runner"; ls /Applications; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Check secrets
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; exit 1; fi
          done
          if [ -z "${{ secrets.ASC_KEY_P8 }}" ]; then echo "::error::Missing secret ASC_KEY_P8"; exit 1; fi

      - name: Copy the FULL edition of the game into the app
        run: |
          W=ios/CatchTheThief/www
          rm -rf "$W" && mkdir -p "$W"
          cp index.html manifest.webmanifest "$W"/
          cp -R lib fonts icons "$W"/
          # bundle PeerJS (online play) inside the app instead of loading it from a CDN
          [ -f "$W/lib/peerjs.min.js" ] || curl -fsSL https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js -o "$W/lib/peerjs.min.js"
          test -s "$W/lib/peerjs.min.js"
          [ -f privacy.html ] && cp privacy.html "$W"/ || true
          python3 - <<'PY'
          p='ios/CatchTheThief/www/index.html'
          h=open(p,encoding='utf8').read()
          assert 'const DEMO=' in h and '<head>' in h
          h=h.replace('<head>','<head><script>window.TV_CONFIG=Object.assign(window.TV_CONFIG||{},{"edition":"full"});</script>',1)
          h=h.replace("if('serviceWorker' in navigator)","if(false)")
          # native app: hide the web-only "install as app / Add to Home Screen" hints
          h=h.replace('</head>','<style>#iosHint,#installBtn{display:none!important}</style></head>',1)
          open(p,'w',encoding='utf8').write(h)
          print('full edition injected')
          PY

      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          # accept either the raw .p8 text or a base64 version of it
          if ! grep -q "BEGIN PRIVATE KEY" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8; then
            echo "${{ secrets.ASC_KEY_P8 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          fi

      - name: Get distribution certificate and App Store profile (no device needed)
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: |
          which fastlane || brew install fastlane
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KC_PASS=$(uuidgen)
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          python3 - <<'PY2'
          import json, os
          kid = os.environ["ASC_KEY_ID"]
          p = os.path.expanduser("~/.appstoreconnect/private_keys/AuthKey_%s.p8" % kid)
          json.dump({"key_id": kid, "issuer_id": os.environ["ASC_ISSUER_ID"], "key": open(p).read(), "in_house": False},
                    open(os.path.join(os.environ["RUNNER_TEMP"], "asc_api_key.json"), "w"))
          PY2
          fastlane cert --api_key_path "$RUNNER_TEMP/asc_api_key.json" \
            --keychain_path "$KEYCHAIN" --keychain_password "$KC_PASS" --output_path "$RUNNER_TEMP/certs"
          fastlane sigh --api_key_path "$RUNNER_TEMP/asc_api_key.json" \
            --app_identifier com.emsekharamy.catchthief \
            --output_path "$RUNNER_TEMP/profiles" --filename AppStore.mobileprovision --force
          PROFILE_NAME=$(security cms -D -i "$RUNNER_TEMP/profiles/AppStore.mobileprovision" | plutil -extract Name raw -o - -)
          echo "Profile: $PROFILE_NAME"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive
        run: |
          cd ios
          xcodebuild -project CatchTheThief.xcodeproj -scheme CatchTheThief \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/CatchTheThief.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Export and upload to App Store Connect (TestFlight)
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.emsekharamy.catchthief</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/CatchTheThief.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }} to App Store Connect"

      - name: Clean up key and keychain
        if: always()
        run: |
          rm -rf ~/.appstoreconnect "$RUNNER_TEMP/asc_api_key.json"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
