<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>امسك حرامي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: full-bleed 3D village; HUD floats in the safe-area corners; menus are centered cards over the live scene */
:root{
  --ink:#172033; --ink-2:#232e47; --paper:#fff6e6; --muted:#a9b3c9;
  --brass:#f4b43c; --siren:#e9474f; --cop:#3f7fe6; --ok:#5cc28a;
  --display:"Lalezar","Readex Pro",system-ui,sans-serif;
  --body:"Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
button{font-family:var(--body);cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--cop);outline-offset:2px}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
.bar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{background:rgba(23,32,51,.84);border:1px solid rgba(255,246,230,.12);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;display:flex;gap:12px;white-space:nowrap}
.chip.cop{box-shadow:inset 0 0 0 2px var(--cop)}
.chip.thief{box-shadow:inset 0 0 0 2px var(--siren)}
.clock{font-family:var(--display);font-size:28px;line-height:1;padding:7px 14px 4px;background:rgba(23,32,51,.84);border-radius:12px;font-variant-numeric:tabular-nums;min-width:84px;text-align:center}
.clock.hot{color:var(--siren)}
#sndBtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);left:max(12px,env(safe-area-inset-left,0px));width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,246,230,.15);background:rgba(23,32,51,.84);font-size:18px;line-height:1;pointer-events:auto}
#sndPanel{position:absolute;top:calc(env(safe-area-inset-top,0px) + 104px);left:max(12px,env(safe-area-inset-left,0px));width:230px;max-width:calc(100% - 24px);background:rgba(23,32,51,.95);border:1px solid rgba(255,246,230,.15);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}
.sl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.sl input{width:100%;accent-color:var(--brass)}
#sndMute{padding:8px;border-radius:10px;border:1px solid rgba(255,246,230,.2);background:transparent;color:var(--paper);font-weight:600}
#goal{position:absolute;top:calc(env(safe-area-inset-top,0px) + 60px);left:50%;transform:translateX(-50%);font-size:13px;background:rgba(23,32,51,.66);padding:6px 12px;border-radius:9px;max-width:calc(100% - 120px);text-align:center;line-height:1.5}
#alarm{position:absolute;top:calc(env(safe-area-inset-top,0px) + 100px);left:50%;transform:translateX(-50%);font-family:var(--display);font-size:22px;background:var(--siren);color:#fff;padding:6px 16px 2px;border-radius:10px;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{background:#b8222b}}
#toast{position:absolute;top:32%;left:50%;transform:translate(-50%,-50%);font-weight:600;font-size:16px;padding:10px 18px;border-radius:12px;background:rgba(23,32,51,.92);border:1px solid rgba(255,246,230,.15);max-width:calc(100% - 40px);text-align:center;line-height:1.5}
#toast.good{border-color:var(--ok);color:#c9f2da}
#toast.bad{border-color:var(--siren);color:#ffd2d4}

#actions{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:flex-end;gap:10px;pointer-events:auto;direction:ltr}
#actions .col{display:flex;flex-direction:column;gap:10px}
body:not(.touch) #actions{transform:scale(.72);transform-origin:bottom right;opacity:.6;pointer-events:none}
.round{border-radius:50%;border:none;font-family:var(--display);color:var(--ink);line-height:1}
.big{width:90px;height:90px;font-size:26px;background-color:var(--brass);background-image:conic-gradient(rgba(255,255,255,.6) calc(var(--p,0) * 360deg),transparent 0);box-shadow:0 6px 0 #b9821c}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #b9821c}
.sm{width:62px;height:62px;font-size:17px;background:var(--paper);box-shadow:0 4px 0 #c9bba3}
.sm.on{background:var(--cop);color:#fff;box-shadow:0 4px 0 #234f9c}
.round:disabled{opacity:.42;cursor:default}

#emotes{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
#emotes button{width:46px;height:46px;border-radius:14px;background:rgba(23,32,51,.84);border:1px solid rgba(255,246,230,.15);font-size:22px;line-height:1}
.touch #emotes{left:auto;transform:none;right:max(16px,env(safe-area-inset-right,0px));bottom:auto;top:calc(env(safe-area-inset-top,0px) + 140px);flex-direction:column}
#joy{display:none;position:absolute;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:130px;height:130px;border-radius:50%;background:rgba(23,32,51,.35);border:2px solid rgba(255,246,230,.28);pointer-events:auto;touch-action:none}
.touch #joy{display:block}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,246,230,.88)}
#keysHint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:12px;color:var(--muted);background:rgba(23,32,51,.7);padding:7px 11px;border-radius:9px;line-height:1.7;max-width:260px}
#keysHint kbd{font-family:var(--body);background:var(--ink-2);border-radius:4px;padding:0 5px;color:var(--paper)}
.touch #keysHint{display:none}

/* Overlays */
.overlay{position:fixed;inset:0;display:flex;padding-block:max(16px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse at center,rgba(23,32,51,.25),rgba(23,32,51,.78));overflow-y:auto}
.card{width:100%;max-width:440px;margin:auto;background:var(--ink);border:1px solid rgba(255,246,230,.1);border-radius:20px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-weight:400;font-size:44px;line-height:1.05;color:var(--brass);margin:0;text-wrap:balance}
.stamp{font-family:var(--display);color:var(--siren);border:2px solid var(--siren);border-radius:6px;padding:4px 8px 0;transform:rotate(-6deg);font-size:17px;white-space:nowrap}
.lede{margin:0;line-height:1.75;font-size:15px}
.lede b{color:var(--brass);font-weight:600}
.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:12px;letter-spacing:.04em;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:42px;height:42px;border-radius:11px;border:none;background:var(--ink-2);color:var(--paper);font-size:22px}
.count{font-family:var(--display);font-size:34px;min-width:36px;text-align:center;line-height:1;padding-top:4px}
.split{color:var(--muted);font-size:13px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--ink-2);padding:4px;border-radius:12px}
.seg button{padding:10px 4px;border-radius:9px;border:none;background:transparent;color:var(--paper);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--brass);color:var(--ink)}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.7;color:#dbe0ec}
.rules li{display:flex;gap:9px}
.rules b{color:var(--brass);font-weight:600}
.cta{font-family:var(--display);font-size:25px;padding:13px 12px 9px;border:none;border-radius:14px;background:var(--brass);color:var(--ink);box-shadow:0 5px 0 #b9821c}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #b9821c}
.ghost{font-weight:600;font-size:15px;padding:11px;border-radius:12px;border:1px solid rgba(255,246,230,.2);background:transparent;color:var(--paper)}
.fine{font-size:12px;color:var(--muted);margin:0;text-align:center;line-height:1.6}
.reveal-card{text-align:center;align-items:center;max-width:380px}
.big-ico{font-size:72px;line-height:1}
.role-name{font-family:var(--display);font-size:42px;line-height:1.1;margin:0}
.role-name.cop{color:#8db5ff}.role-name.thief{color:#ff8a90}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--ink-2);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px}.row>*{flex:1}
.inp{font-family:var(--body);font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,246,230,.2);background:var(--ink-2);color:var(--paper);min-width:0}
.inp:focus-visible{outline:3px solid var(--cop);outline-offset:1px}
.code-in{direction:ltr;text-align:center;letter-spacing:.2em;text-transform:uppercase}
.code{font-family:var(--display);font-size:48px;line-height:1;text-align:center;letter-spacing:.25em;direction:ltr;color:var(--brass);padding:10px 0 4px;background:var(--ink-2);border-radius:14px}
.players{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:210px;overflow-y:auto}
.players li{background:var(--ink-2);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.cta:disabled,.ghost:disabled{opacity:.45;cursor:default}
/* countries, rooms, settings */
.flags,.rooms{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.flags button,.rooms button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px 7px;border-radius:12px;border:1px solid rgba(255,246,230,.14);background:var(--ink-2);color:var(--paper);font-weight:600;font-size:12px;line-height:1.2;min-width:0}
.flags button span,.rooms button span{max-width:100%;text-align:center;line-height:1.15}
.flags button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--brass);border-color:var(--brass);background:#2c3858}
.rooms button:disabled{opacity:.5;cursor:default}
.maps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.maps button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 7px;border-radius:12px;border:1px solid rgba(255,246,230,.14);background:var(--ink-2);color:var(--paper);font-weight:600;font-size:12px;line-height:1.15;min-width:0}
.maps button b{font-size:20px;line-height:1;font-weight:400}
.maps button span{max-width:100%;text-align:center}
.maps button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--brass);border-color:var(--brass);background:#2c3858}
.flag{width:34px;height:23px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.3);display:block;flex:0 0 auto}
.rooms .flag{width:40px;height:27px}
.sel{font-family:var(--body);font-size:15px;padding:9px 10px;border-radius:12px;border:1px solid rgba(255,246,230,.2);background:var(--ink-2);color:var(--paper);min-width:0}
.setrow{align-items:center}.setrow>.label{flex:0 0 auto}
.roomname{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--display);font-size:32px;line-height:1;color:var(--brass);padding:12px 0 8px;background:var(--ink-2);border-radius:14px}
.roomname .flag{width:48px;height:32px}
details.priv{background:var(--ink-2);border-radius:12px;padding:10px 12px}
details.priv summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--paper)}
details.priv[open] summary{margin-bottom:10px}
details.priv .row{margin-bottom:8px}
.wide{width:100%}
html[lang=en] .sm,html[lang=fr] .sm{font-size:14px}
html[lang=en] .big,html[lang=fr] .big{font-size:21px}
/* phone layout: slim top strip, hint moved down above the controls so the middle of the view stays clear */
.touch .bar{top:calc(env(safe-area-inset-top,0px) + 6px)}
.touch .clock{font-size:20px;min-width:58px;padding:5px 10px 3px;border-radius:10px;background:rgba(23,32,51,.6)}
.touch .chip{font-size:12px;padding:5px 9px;gap:8px;background:rgba(23,32,51,.6)}
.touch #goal{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 168px);font-size:12px;padding:5px 10px;background:rgba(23,32,51,.55);max-width:calc(100% - 32px)}
.touch #alarm{top:calc(env(safe-area-inset-top,0px) + 46px);font-size:16px;padding:4px 12px 1px}
.touch #toast{top:24%;font-size:14px}
.touch #sndBtn{top:calc(env(safe-area-inset-top,0px) + 46px);width:34px;height:34px;font-size:15px;background:rgba(23,32,51,.6)}
.touch #sndPanel{top:calc(env(safe-area-inset-top,0px) + 86px)}
@media (orientation:landscape){
  .touch #goal{bottom:calc(env(safe-area-inset-bottom,0px) + 18px);max-width:calc(100% - 420px)}
  .touch #emotes{flex-direction:row;top:calc(env(safe-area-inset-top,0px) + 62px)}
  .touch #emotes button{width:40px;height:40px;font-size:19px}
}
@media (prefers-reduced-motion:reduce){#alarm{animation:none}}
@media (max-width:420px){h1{font-size:36px}.clock{font-size:24px;min-width:70px}.chip{font-size:13px;padding:6px 10px;gap:8px}}

/* victory banner */
#celeb{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 7vh);pointer-events:auto;background:radial-gradient(ellipse at center,transparent 45%,rgba(23,32,51,.35))}
#celeb .cb-main{font-family:var(--display);font-size:clamp(34px,9vw,64px);color:#ffd56a;text-shadow:0 3px 0 #9a6a10,0 0 28px rgba(255,213,106,.75);animation:cbIn .7s cubic-bezier(.2,1.6,.4,1) both;text-align:center;padding:0 16px}
#celeb .cb-sub{margin-top:6px;font-family:var(--display);font-size:clamp(20px,5vw,30px);color:#fff6e6;text-shadow:0 2px 6px rgba(0,0,0,.5);animation:cbIn .7s .25s cubic-bezier(.2,1.6,.4,1) both}
#celeb .cb-skip{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);font-size:13px;color:rgba(255,246,230,.75)}
@keyframes cbIn{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
/* opening intro: thief runs, officer trips, then the game opens from a small circle */
#intro{--r:-2px;position:fixed;inset:0;z-index:50;background:#000;-webkit-mask-image:radial-gradient(circle at 50% 50%,transparent var(--r,0px),#000 calc(var(--r,0px) + 1px));mask-image:radial-gradient(circle at 50% 50%,transparent var(--r,0px),#000 calc(var(--r,0px) + 1px))}
#intro canvas{display:block;width:100%;height:100%}
#intro .in-skip{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);inset-inline:0;text-align:center;font-size:13px;color:#6f6a60;font-family:var(--body)}
#intro .in-tap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:clamp(26px,7vw,40px);color:#ffd56a;animation:tapPulse 1.2s ease-in-out infinite}
@keyframes tapPulse{50%{opacity:.45;transform:scale(.94)}}
#exitBtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);left:calc(max(12px,env(safe-area-inset-left,0px)) + 48px);width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,246,230,.15);background:rgba(23,32,51,.84);font-size:18px;line-height:1;pointer-events:auto}
#setExit{padding:9px;border-radius:10px;border:none;background:var(--siren);color:#fff;font-weight:600}
#exitAsk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,14,24,.55);pointer-events:auto;z-index:20}
#exitAsk .box{background:var(--ink);border:1px solid rgba(255,246,230,.15);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;width:min(280px,calc(100% - 32px));text-align:center}
#exitAsk b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--paper)}
#exitAsk .r2{display:flex;gap:8px}
#exitAsk button{flex:1;padding:11px 6px;border-radius:10px;border:none;font-weight:600;font-size:15px}
#exitYes{background:var(--siren);color:#fff} #exitNo{background:var(--ink-2);color:var(--paper)}
#btnCop{background:var(--cop);color:#fff;box-shadow:0 4px 0 #234f9c;font-size:13px;animation:tapPulse 1s ease-in-out infinite}
  .mini{font-size:12px;padding:2px 8px;margin-inline-start:6px;text-decoration:none;display:inline-block}
  #privLink{display:block;text-align:center;font-size:12px;opacity:.75;margin-top:10px;color:inherit}
</style>
</head>
<body>


<div id="stage"></div>

<div id="hud" hidden>
  <div class="bar">
    <div class="chip" id="roleChip"></div>
    <div class="clock" id="clock">3:00</div>
    <div class="chip"><span id="lootTxt"></span><span id="thiefTxt"></span></div>
  </div>
  <div id="goal"></div>
  <button id="sndBtn" data-i18n-aria="set.aria" aria-label="الإعدادات" aria-expanded="false">⚙️</button>
  <button id="exitBtn" data-i18n-aria="exit.aria" aria-label="خروج">🚪</button>
  <div id="sndPanel" hidden>
    <label class="sl" for="volMaster"><span data-i18n="snd.master">الصوت العام</span><input id="volMaster" type="range" min="0" max="100"></label>
    <label class="sl" for="volSfx"><span data-i18n="snd.sfx">المؤثرات</span><input id="volSfx" type="range" min="0" max="100"></label>
    <label class="sl" for="volMusic"><span data-i18n="snd.music">موسيقى الخلفية</span><input id="volMusic" type="range" min="0" max="100"></label>
    <button id="sndMute">كتم الصوت</button>
    <button id="setExit" data-i18n="set.exit">🚪 خروج</button>
  </div>
  <div id="exitAsk" hidden><div class="box"><b data-i18n="exit.ask">تخرج من الجولة؟</b><div class="r2"><button id="exitYes" data-i18n="exit.yes">أيوه اخرج</button><button id="exitNo" data-i18n="exit.no">لا كمّل</button></div></div></div>
  <div id="alarm" hidden></div>
  <div id="toast" hidden></div>
  <div id="joy"><div id="knob"></div></div>
  <div id="keysHint" data-i18n-html="keys"></div>
  <div id="emotes">
    <button id="em1" data-e="wave" data-i18n-aria="em.wave" aria-label="تحية">👋</button>
    <button id="em2" data-e="laugh" data-i18n-aria="em.laugh" aria-label="ضحك">😂</button>
    <button id="em3" data-e="dance" data-i18n-aria="em.dance" aria-label="رقص">💃</button>
    <button id="em4" data-e="point" data-i18n-aria="em.point" aria-label="إنت!">👉</button>
  </div>
  <div id="actions">
    <div class="col">
      <button id="btnRun" class="round sm" data-i18n="btn.run">جري</button>
      <button id="btnCop" class="round sm" data-i18n="btn.cop" hidden>👮 ظابط</button>
      <button id="btnDis" class="round sm" data-i18n="btn.disguise">تنكّر</button>
    </div>
    <button id="btnAct" class="round big" data-i18n="btn.arrest">اقبض</button>
  </div>
</div>

<div id="lobby" class="overlay">
  <div class="card">
    <div class="head"><h1 data-i18n="title">امسك حرامي</h1><span class="stamp" data-i18n="stamp.wanted">مطلوب</span></div>
    <p class="lede" data-i18n-html="lobby.lede"></p>
    <div class="field">
      <span class="label" data-i18n="lobby.country">البلد</span>
      <div class="flags" id="countrySeg"></div>
    </div>
    <div class="field">
      <span class="label" data-i18n="lobby.map">الخريطة</span>
      <div class="maps" id="mapSeg"></div>
    </div>
    <div class="field">
      <span class="label" data-i18n="lobby.players">عدد اللاعبين</span>
      <div class="stepper">
        <button id="minus" data-i18n-aria="aria.less" aria-label="أقل">−</button>
        <span class="count" id="pCount">5</span>
        <button id="plus" data-i18n-aria="aria.more" aria-label="أكتر">+</button>
        <span class="split" id="pSplit"></span>
      </div>
    </div>
    <div class="field">
      <span class="label" data-i18n="lobby.role">دورك</span>

   Style: chunky low-poly villagers (hood, cap, tunic, satchel) and chibi officers (peaked cap with badge,
   short-sleeve uniform, belt). Each character is 6 meshes: torso, head, two arms, two legs. The parts of

function mergeParts(parts){
  const m4=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(), c=new THREE.Color(); let total=0;

  out.setAttribute('position',new THREE.BufferAttribute(pos,3)); out.setAttribute('normal',new THREE.BufferAttribute(nor,3)); out.setAttribute('color',new THREE.BufferAttribute(col,3));

function tickKeepers(dt,now){
  const k8=Math.min(1,dt*8), k14=Math.min(1,dt*14);
  for(const k of keepers){
    const r=k.rig, bx=k.house.keeperAt.x, bz=k.house.keeperAt.z; k.t+=dt;
    let bob=Math.sin(now*2+k.phase)*0.015, rx=0, yaw=k.house.yaw, aLx=0,aLz=0,aRx=0,aRz=0,leg=0; k.off.set(0,0,0);
    if(k.state==='idle'){ k.glanceT-=dt; if(k.glanceT<=0){ k.glanceT=rand(3,7); k.glance=Math.random()<0.5?0:rand(-0.6,0.6); } yaw+=k.glance; }
    else{
      const tg=k.target; if(tg) yaw=Math.atan2(tg.pos.x-bx,tg.pos.z-bz);
      if(k.state==='point'){ aRx=-1.55; if(k.t>=2){ k.state='react'; k.t=0; if(k.act==='bang') S.play('bang',k.grp.position); } }
      else{ const T=k.t;
        switch(k.act){
          case 'fist':    aRx=-2.7+Math.sin(now*16)*0.35; bob+=Math.abs(Math.sin(now*8))*0.05; break;
          case 'jump':    bob+=Math.abs(Math.sin(now*9))*0.35; aLz=-2.5; aRz=2.5; break;
          case 'chase': { const f=T<0.5?T/0.5:T<1.9?1:Math.max(0,1-(T-1.9)/0.5); k.off.set(k.house.side.x*1.4*f,0,k.house.side.z*1.4*f);
                          if(T<0.5||(T>1.9&&T<2.4)) leg=Math.sin(now*16)*0.7; aRx=-1.4; break; }
          case 'bang':    aRx=-1.15+Math.sin(now*19)*0.55; break;
          case 'cleaver': aRz=2.7+Math.sin(now*14)*0.2; aLx=-0.6; break;
          case 'faint':   rx=-Math.min(1.45,T*5)*(T<2.2?1:Math.max(0,1-(T-2.2)/0.4)); aLz=-0.5; aRz=0.5; break;
          case 'whistle': aRx=-2.3; aRz=0.5; aLz=-2.5+Math.sin(now*12)*0.4; break;
          case 'cover':   aLx=-1.25; aRx=-1.25; rx=0.22; bob+=Math.sin(now*30)*0.02; break;
        }
        if(k.t>=2.6){ k.state='idle'; k.t=0; k.target=null; k.bubble.visible=false; k.bang.visible=false; }
      }
    }
    k.grp.position.set(bx+k.off.x,0,bz+k.off.z); k.grp.rotation.y=angLerp(k.grp.rotation.y,yaw,k8);
    r.body.position.y=bob; r.root.rotation.x+=(rx-r.root.rotation.x)*k14;
    r.armR.rotation.x+=(aRx-r.armR.rotation.x)*k14; r.armR.rotation.z+=(aRz-r.armR.rotation.z)*k14;
    r.armL.rotation.x+=(aLx-r.armL.rotation.x)*k14; r.armL.rotation.z+=(aLz-r.armL.rotation.z)*k14;
    r.legL.rotation.x+=(leg-r.legL.rotation.x)*k14; r.legR.rotation.x+=(-leg-r.legR.rotation.x)*k14;
  }
}

/* ---------- core actions ---------- */
/* perspective messages: the same text whether the action happened here or on the online host */
function msgWrong(o){ if(o===player) toast(T('t.wrongMe'),'bad'); else if(player&&d2(o.pos,player.pos)<16) toast(T('t.wrongOther')); }
function msgReveal(t,o){ if(!player) return;
  if(t===player) toast(T('t.revealMe'),'bad');
  else if(o===player) toast(T('t.revealBy'),'good');
  else if(player.kind==='officer') toast(T('t.revealMate'),'good');
  else toast(T('t.revealPartner'),'bad'); }
function msgHide(t){ if(!player) return;
  if(t===player) toast(T('t.hideMe'),'good');
  else if(player.kind==='officer') toast(T('t.hideOfficer'),'bad');
  else toast(T('t.hidePartner'),'good'); }
function msgArrest(t){ if(!player) return;
  if(t===player) toast(T('t.arrestMe'),'bad');
  else if(player.kind==='officer') toast(T('t.arrestOfficer'),'good');
  else toast(T('t.arrestPartner'),'bad'); }
function msgSteal(e,L){ if(!player) return;
  toast(T(player.kind==='thief'?(e===player?'t.stealMe':'t.stealPartner'):'t.stealOfficer',{shop:L.name}),player.kind==='thief'?'good':'bad'); }
function setBeacon(t,on){
  if(on&&!t.beacon){ t.beacon=new THREE.Mesh(G.redBeam,new THREE.MeshBasicMaterial({color:'#e9474f',transparent:true,opacity:.3,depthWrite:false})); t.beacon.position.y=8; t.group.add(t.beacon); }
  else if(!on&&t.beacon){ t.group.remove(t.beacon); t.beacon.material.dispose(); t.beacon=null; } }
function addCage(t){ if(t.cage) return; const cage=new THREE.Group(); const m=mat('#5b6377');
  for(let i=0;i<10;i++){const a=i/10*TAU,b=mesh(G.bar,m); b.position.set(Math.cos(a)*0.85,1.3,Math.sin(a)*0.85); cage.add(b);}
  const top=mesh(new THREE.TorusGeometry(0.85,0.06,6,20),m); top.rotation.x=Math.PI/2; top.position.y=2.6; cage.add(top);
  t.group.add(cage); t.cage=cage; }
function reveal(t){
  t.revealed=true; t.revealT=15; t.grace=1.2; t.stealing=null; t.stealT=0; t.hopT=0;
  setLook(t,THIEF_LOOK); setBeacon(t,true); puff(t.pos); say(t,'😱',1.5); S.play('reveal');
}
/* the hiding spot after a reveal: a free street point far from every officer and from where the thief stood */
function hideSpot(t){
  const offs=ents.filter(o=>o.kind==='officer'); let best=null,bs=-1;
  for(let i=0;i<40;i++){ const w=pick(wps); const dOff=offs.reduce((m,o)=>Math.min(m,d2(o.pos,w)),99), dMe=d2(t.pos,w);
    if(dMe<8) continue; const sc=Math.min(dOff,18)+Math.random()*3; if(sc>bs){bs=sc;best=w;} }
  return best||randomSpot(10);
}
function hideAgain(t){
  t.revealed=false; setLook(t,pick(VLOOKS.filter(l=>l!==t.look))); setBeacon(t,false); puff(t.pos); S.play('unwhoosh');
  const w=hideSpot(t); t.pos.set(w.x,0,w.z); t.stealing=null; t.stealT=0; t.goal=null; t.detour=null; t.nav=null; t.tpT=1.5; puff(t.pos);
  for(const o of ents) if(o.kind==='officer'){o.susp.set(t,0.2); if(o.chase===t){o.mode='patrol';o.chase=null;}}
  msgHide(t); netEvent('hd',t.id,[Math.round(w.x*20),Math.round(w.z*20)]);
}
function arrestThief(t){
  t.arrested=true; t.revealed=false; t.stealing=null; t.moving=false;
  setBeacon(t,false); addCage(t); say(t,'😵',3); S.play('jail');
  msgArrest(t); netEvent('ar',t.id);
  checkEnd();
}
function doArrest(o,t){
  o.arrestCD=1.2; emote(o,'point');
  if(t.kind==='villager'){
    o.stun=3.2; say(o,'💫',3.2); say(t,'😠',2); t.state='idle'; t.timer=2; game.wrong++; S.play('wrong',o.pos);
    msgWrong(o); netEvent('w',o.id,t.id);
    return;
  }
  if(t.kind!=='thief'||t.grace>0) return;
  if(!t.revealed){ reveal(t); msgReveal(t,o); netEvent('rv',t.id,o.id); }
  else { game.lastCop=o; arrestThief(t); }
}
function changeDisguise(e){
  if(e.revealed||e.arrested||e.disguiseCD>0) return false;
  setLook(e,pick(VLOOKS.filter(l=>l!==e.look))); puff(e.pos); e.disguiseCD=20; if(e===player) S.play('whoosh');
  for(const o of ents) if(o.kind==='officer'&&d2(o.pos,e.pos)<6) o.susp.set(e,(o.susp.get(e)||0)+0.9);
  netEvent('dg',e.id);
  return true;
}
function stealTick(e,dt){
  const L=e.stealing; if(!L||L.taken){e.stealing=null;e.stealT=0;return;}
  e.stealT+=dt; if(e===player){ if(Math.random()<dt*10) sparkle(L.door); S.play('tick',L.door); }
  if(e.stealT>=STEAL_TIME){
    L.taken=true; L.marker.visible=false; game.stolen++; e.stealing=null; e.stealT=0; if(e===player){ coins(L.door); say(e,'💰',1.5); S.play('coins'); } keeperReact(h2k(L.house),e);
    msgSteal(e,L); netEvent('st',e.id,game.loot.indexOf(L));
    checkEnd();
  }
}

/* ---------- a free thief can break a caged partner out (stand still next to the cage) ---------- */
const RESCUE_TIME=2.5;
function jailedMate(e,maxD){ let best=null,bd=maxD; for(const o of ents){ if(o===e||o.kind!=='thief'||!o.arrested) continue; const d=d2(e.pos,o.pos); if(d<bd){bd=d;best=o;} } return best; }
function unjail(t){ t.arrested=false; if(t.cage){ t.group.remove(t.cage); t.cage=null; } }
function msgFree(t,by){ if(!player) return;
  if(t===player) toast(T('t.freedMe'),'good');
  else if(player.kind==='officer') toast(T('t.freedOfficer'),'bad');
  else toast(T(by===player?'t.freedPartner':'t.freedMate'),'good'); }
function freeThief(t,by){
  unjail(t); t.revealed=false; setBeacon(t,false); puff(t.pos);
  setLook(t,pick(VLOOKS)); const w=hideSpot(t); t.pos.set(w.x,0,w.z); t.tpT=1.5; t.stealing=null; t.stealT=0; t.rescue=null; t.goal=null; t.detour=null; t.nav=null; t.grace=2; t.disguiseCD=Math.min(t.disguiseCD,6);
  puff(t.pos); say(t,'😎',2); S.play('unwhoosh');
  for(const o of ents) if(o.kind==='officer'){ o.susp.set(t,0); if(o.chase===t){o.mode='patrol';o.chase=null;} }
  msgFree(t,by); netEvent('fr',t.id,[Math.round(w.x*20),Math.round(w.z*20)]);
}
function rescueTick(e,dt){
  const t=e.rescue; if(!t||!t.arrested||e.arrested||e.revealed||d2(e.pos,t.pos)>2.6){ e.rescue=null; e.rescueT=0; return; }
  e.rescueT+=dt; if(e===player) S.play('tick',t.pos);
  if(e.rescueT>=RESCUE_TIME){ e.rescue=null; e.rescueT=0; freeThief(t,e); }
}
/* ---------- last minute: when only one thief is still free, he may dress up as an officer once ---------- */
function canCop(e){
  if(!e||game.state!=='play'||game.time>60||e.kind!=='thief'||e.arrested||e.revealed||e.copUsed) return false;
  for(const o of ents) if(o!==e&&o.kind==='thief'&&!o.arrested) return false;
  return true;
}
function copDisguise(e){
  if(!canCop(e)) return false;
  e.copUsed=true; setLook(e,pick(COPS)); puff(e.pos); if(e===player) S.play('whoosh');
  for(const o of ents) if(o.kind==='officer') o.susp.set(e,Math.min(o.susp.get(e)||0,0.3));
  netEvent('cd',e.id); return true;
}
function playerCop(){
  if(!player||!canCop(player)) return;
  if(NET.mode==='client'){ player.copUsed=true; netAct('cd'); toast(T('t.copMe'),'good'); return; }
  if(copDisguise(player)) toast(T('t.copMe'),'good');
}
function arrestCandidate(e){let best=null,bd=2.3;for(const t of ents){if(t===e||t.kind==='officer'||t.arrested)continue;const d=d2(e.pos,t.pos);if(d<bd){bd=d;best=t;}}return best;}

/* ---------- AI ---------- */
function aiVillager(e,dt){
  if(e.state==='idle'){e.wantMove=false;e.moving=false;e.timer-=dt;if(e.timer<=0){e.target=nearWaypoint(e.pos,16);e.state='walk';}}
  else{e.wantMove=true;const dx=e.target.x-e.pos.x,dz=e.target.z-e.pos.z;
    if(dx*dx+dz*dz<1.3||e.stuck&&e.stuckN>2){e.state='idle';e.timer=rand(1.2,4.2);e.stuck=false;e.moving=false;return;}
    const sv=seek(e,e.target.x,e.target.z,dt); steer(e,sv[0],sv[1],e.speedBase,dt,3.2,true);}
  if(Math.random()<dt*0.006&&!e.emote) emote(e,Math.random()<0.7?'wave':'laugh');
}
function aiOfficer(e,dt){
  e.running=false;
  if(e.stun>0){e.moving=false;e.wantMove=false;return;}
  const sens=player&&player.kind==='officer'?0.5:1;
  let best=null,bestS=0;
  for(const t of ents){ if(t.kind!=='thief'||t.arrested) continue;
    let s=e.susp.get(t)||0; const d=d2(e.pos,t.pos);
    if(t.revealed){ if(d<28) s=2; }
    else{ if(d<9){const near=d<4?1.6:1; if(t.tellOn) s+=t.tellW*near*sens*dt; if(t.moving&&t.running) s+=0.8*near*sens*dt; if(t.stealing) s+=0.45*near*sens*dt; if(t.rescue) s+=1.2*near*sens*dt;} s-=0.07*dt; }
    s=clamp(s,0,2.5); e.susp.set(t,s); if(s>bestS){bestS=s;best=t;}
  }
  if(best&&(bestS>1||(e.mode==='chase'&&e.chase===best&&bestS>0.55))){ if(e.mode!=='chase') say(e,'❗',1.2); e.mode='chase'; e.chase=best; e.prank=null; }

/* ---------- animation ---------- */
function animate(e,dt,now){
  if(e.victory){ animVictory(e,dt,now); return; }
  const r=e.rig; let bob=0,sw=0;
  const tell=(e.kind==='thief'&&!e.revealed&&!e.arrested)?game.tell:null, T=tell?TELLS[tell]:null;
  if(e.moving){const f=clamp(e.curSpeed/2.1,0.6,2.6); e.phase+=dt*7.5*f*(tell==='quick'?1.45:1); sw=(e.running?0.95:0.55)*(tell==='quick'?0.6:1); bob=Math.abs(Math.sin(e.phase))*0.07;}
  const s=Math.sin(e.phase), k=Math.min(1,dt*12);
  r.legL.rotation.x+=((e.moving?s*sw:0)-r.legL.rotation.x)*k;
  r.legR.rotation.x+=((e.moving?-s*sw*(tell==='limp'?0.45:1):0)-r.legR.rotation.x)*k;
  r.armL.rotation.x+=((e.moving?-s*sw*0.8:0)-r.armL.rotation.x)*k;
  r.armR.rotation.x+=((e.moving?s*sw*0.8*(tell==='stiff'?0.08:1):0)-r.armR.rotation.x)*k;
  r.armL.rotation.z+=(0-r.armL.rotation.z)*k; r.armR.rotation.z+=(0-r.armR.rotation.z)*k;
  /* event tells (hop / glance): short moments at irregular intervals */
  if(T&&T.event&&e.moving){e.hopCD-=dt; if(e.hopCD<=0&&e.hopT<=0){e.hopT=1e-4;e.hopCD=e.running?rand(0.7,1.0):rand(1.4,2.0);e.lookDir=Math.random()<0.5?-1:1;}}
  let ev=0; if(e.hopT>0){e.hopT+=dt;const q=e.hopT/(tell==='look'?0.45:0.2); if(q>=1)e.hopT=0; else ev=Math.sin(q*Math.PI);}
  if(tell==='hop') bob+=ev*(e.running?0.18:0.1);
  /* what bot officers can pick up: events weigh more, constant quirks less */
  e.tellOn=!!T&&e.moving&&(T.event?ev>0:true); e.tellW=T?(T.event?T.w:T.w*(e.running?1.6:1)):0;
  let ry=e.heading,rz=0,rx=0;
  if(tell==='look') ry+=ev*0.75*(e.lookDir||1);
  if(tell==='limp'&&e.moving){const dip=Math.max(0,-s); bob-=dip*0.05; rz+=dip*0.08;}
  if(tell==='sway'&&e.moving) rz+=Math.sin(e.phase*0.5)*0.075;
  if((e.stealing||e.rescue)&&e===player){r.armL.rotation.x=-1.2+Math.sin(now*18)*0.25;r.armR.rotation.x=-1.2-Math.sin(now*18)*0.25;}
  if(e.emoteT>0){e.emoteT-=dt;
    if(e.emote==='wave'){r.armR.rotation.z=2.6+Math.sin(now*14)*0.35;r.armR.rotation.x=0;}
    else if(e.emote==='laugh'){bob+=Math.abs(Math.sin(now*22))*0.08;rx=-0.15;}
    else if(e.emote==='dance'){ry+=now*7;bob+=Math.abs(Math.sin(now*10))*0.15;r.armL.rotation.z=-2.4+Math.sin(now*10)*0.4;r.armR.rotation.z=2.4-Math.sin(now*10)*0.4;}
    else if(e.emote==='point'){r.armR.rotation.x=-1.5;}
    if(e.emoteT<=0)e.emote=null;}
  if(e.stun>0){e.stun-=dt;rz=Math.sin(now*11)*0.18;}
  if(e.arrested) rx=0.25;
  r.body.position.y=bob; r.root.rotation.set(rx,ry,rz);
  if(e.bubbleT>0){e.bubbleT-=dt;if(e.bubbleT<=0)e.bubble.visible=false;}
  if(e.ring) e.ring.scale.setScalar(1+Math.sin(now*4)*0.08);
}


/* ---------- victory: the winner gets a golden light and one of 5 random victory moves ---------- */
const VICTORY=['jump','spin','pump','dance','flip'];
const celebLight=new THREE.PointLight('#ffc23d',0,9,1.6); scene.add(celebLight);
let celeb=null, celebTimer=0;
function animVictory(e,dt,now){
  const r=e.rig, t=(e.vT+=dt), k=Math.min(1,dt*14), H=e.heading;
  let bob=0,rx=0,ry=H,rz=0,py=0,flip=0,aLx=0,aLz=0,aRx=0,aRz=0,lL=0,lR=0;
  switch(e.victory){
    case 'jump':{ const c=(t%0.85)/0.85, h=Math.sin(c*Math.PI); py=h*1.15; aLz=-2.5-h*0.35; aRz=2.5+h*0.35; lL=lR=h*0.55; if(h<0.15) bob=-0.08; break; }
    case 'spin':{ const c=t%1.9; if(c<1.2){ const q=c/1.2, ez=q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2; ry=H+ez*TAU*2; py=Math.sin(q*Math.PI)*0.35; aLz=-1.55; aRz=1.55; } else { aLz=-2.6; aRz=2.6; bob=Math.abs(Math.sin(now*10))*0.06; } break; }
    case 'pump':{ const s=Math.sin(now*11); aRz=2.25+s*0.55; aRx=-0.2; aLx=-0.9; aLz=-0.3; bob=Math.max(0,s)*0.14; rx=-0.12; lL=Math.max(0,s)*0.25; break; }
    case 'dance':{ const s=Math.sin(now*8); rz=s*0.16; ry=H+Math.sin(now*4)*0.55; aLz=-1.3-Math.max(0,s)*1.3; aRz=1.3+Math.max(0,-s)*1.3; lL=s*0.45; lR=-s*0.45; bob=Math.abs(s)*0.13; break; }
    case 'flip':{ const c=t%2.2;
      if(c<0.25){ bob=-0.18*(c/0.25); aLx=aRx=0.9; }
      else if(c<0.95){ const q=(c-0.25)/0.7; py=Math.sin(q*Math.PI)*1.9; flip=-q*TAU; aLz=-2.4; aRz=2.4; lL=lR=Math.sin(q*Math.PI)*1.1; }
      else if(c<1.1){ bob=-0.15*(1-(c-0.95)/0.15); }
      else { aLz=-2.6; aRz=2.6; bob=Math.abs(Math.sin(now*9))*0.05; }
      break; }
  }
  r.armL.rotation.x+=(aLx-r.armL.rotation.x)*k; r.armR.rotation.x+=(aRx-r.armR.rotation.x)*k;
  r.armL.rotation.z+=(aLz-r.armL.rotation.z)*k; r.armR.rotation.z+=(aRz-r.armR.rotation.z)*k;
  r.legL.rotation.x+=(lL-r.legL.rotation.x)*k; r.legR.rotation.x+=(lR-r.legR.rotation.x)*k;

}
function pickWinner(winner){
  const side=winner==='officers'?'officer':'thief';
  if(player&&player.kind===side&&!player.arrested) return player;
  if(side==='officer'){
    if(game.lastCop&&ents.includes(game.lastCop)) return game.lastCop;
    let lt=null; for(const e of ents) if(e.kind==='thief'&&e.arrested) lt=e;
    if(lt){ const o=nearestOf(lt,'officer',1e9); if(o) return o; }
  }
  return ents.find(e=>e.kind===side&&!e.arrested)||ents.find(e=>e.kind===side)||null;
}

/* ---------- simulation ---------- */
function simulate(dt,live,now){
  for(const e of ents){
    if(e.isPlayer){ if(live) updatePlayer(dt); else e.moving=false; }
    else if(NET.mode==='client') puppet(e,dt);
    else if(e.remote) tickRemote(e,dt);
    else if(e.kind==='villager') aiVillager(e,dt);
    else if(e.kind==='officer'){ if(live||game.state==='lobby') aiOfficer(e,dt); else e.moving=false; }
    else { if(live) aiThief(e,dt); else e.moving=false; }
    if(e.kind==='officer') e.arrestCD-=dt;
    if(e.kind==='thief'&&live&&NET.mode!=='client') tickThief(e,dt);
    e.stuckClock+=dt; if(e.stuckClock>0.8){e.stuck=e.wantMove&&d2(e.pos,e.stuckRef)<0.3;e.stuckN=e.stuck?(e.stuckN||0)+1:0;e.stuckRef.copy(e.pos);e.stuckClock=0;}
    animate(e,dt,now);
  }
  for(let i=0;i<ents.length;i++)for(let j=i+1;j<ents.length;j++){
    const a=ents[i],b=ents[j],dx=b.pos.x-a.pos.x,dz=b.pos.z-a.pos.z,dd=dx*dx+dz*dz;
    if(dd<0.81&&dd>1e-6){const d=Math.sqrt(dd),p=(0.9-d)/2,nx=dx/d*p,nz=dz/d*p, cl=NET.mode==='client';
      if(!a.arrested&&(!cl||a.isPlayer)){a.pos.x-=nx;a.pos.z-=nz;} if(!b.arrested&&(!cl||b.isPlayer)){b.pos.x+=nx;b.pos.z+=nz;}}
  }
  for(const L of game.loot){ if(L.taken) continue; L.gem.rotation.y+=dt*2; L.gem.position.y=2.6+Math.sin(now*2.4)*0.15;
    if(L.shake>0){L.shake-=dt;L.gem.position.x=Math.sin(now*60)*0.1;} else L.gem.position.x=0; }
}

const camLook=new THREE.Vector3(), camTarget=new THREE.Vector3(); let orbit=0;
function updateCamera(dt,snap){
  if(celeb&&game.state==='end'){ const e=celeb.e, a=celeb.ang+Math.sin(celeb.t*0.4)*0.55, d=7.2+Math.max(0,1.4-celeb.t)*4, kk=1-Math.exp(-dt*3.2);
    camera.position.lerp(camTarget.set(e.pos.x+Math.sin(a)*d,3.1,e.pos.z+Math.cos(a)*d),kk);
    camLook.lerp(new THREE.Vector3(e.pos.x,1.5,e.pos.z),kk); camera.lookAt(camLook); return; }
  if(game.state==='lobby'||!player){orbit+=dt*0.07;camera.position.set(Math.sin(orbit)*44,24,Math.cos(orbit)*44);camera.lookAt(0,4,0);return;}
  const portrait=innerHeight>innerWidth, p=player.pos;
  const dist=portrait?24:19.5, cp=Math.cos(cam.pitch);
  const k=snap?1:1-Math.exp(-dt*5);
  camLook.lerp(camTarget.set(p.x,1,p.z),k);
  camera.position.set(camLook.x+Math.sin(cam.yaw)*cp*dist,camLook.y+Math.sin(cam.pitch)*dist,camLook.z+Math.cos(cam.yaw)*cp*dist);

/* disposeTree(): free per-round GPU resources; shared geometry (G) and cached materials (mat()) are kept for reuse */
const SHARED_GEO=new Set(Object.values(G));
function disposeTree(root){
  const cached=new Set(Object.values(matCache));
  root.traverse(o=>{
    if(o.geometry&&!SHARED_GEO.has(o.geometry)&&!o.geometry.userData.shared) o.geometry.dispose();
    if(o.material){ for(const m of (Array.isArray(o.material)?o.material:[o.material])){ if(cached.has(m)||m.userData.keep) continue;
      if(m.map&&!m.map.__keep){ if(m.map.__redraw) lateDraw.delete(m.map.__redraw); m.map.dispose(); } m.dispose(); } }
  });
}
function clearWorld(){
  for(const e of ents){ scene.remove(e.group); disposeTree(e.group); } ents=[];
  for(const q of particles){scene.remove(q.m);q.m.material.dispose();} particles=[];

/* a round is described by a setup: country, shop loot, tell and every character (kind, look, owner).

const KIND=['villager','officer','thief'];

let roundNo=0, lastMap=null;
function makeSetup(humans,country){
  const total=Math.max(cfg.players,humans.length), thieves=thievesFor(total), need=needFor(thieves);
  const slots=humans.map(o=>({owner:o})); while(slots.length<total) slots.push({owner:null});
  let order;
  if(humans.length===1&&humans[0]==='me'&&cfg.role!=='random'){ const me=slots[0], bots=slots.slice(1);
    order=cfg.role==='thief'?[me,...bots]:[...bots.slice(0,thieves),me,...bots.slice(thieves)]; }
  else order=slots.slice().sort(()=>Math.random()-0.5);
  const k=[]; for(let i=0;i<16;i++) k.push([0,i%VLOOKS.length,null]);
  order.slice(thieves).forEach((sl,i)=>k.push([1,i%COPS.length,sl.owner]));
  order.slice(0,thieves).forEach(sl=>k.push([2,(Math.random()*VLOOKS.length)|0,sl.owner]));
  const m=cfg.map==='random'||!MAPS[cfg.map]?pick(MAP_IDS.filter(x=>x!==lastMap)):cfg.map; lastMap=m;
  return {r:++roundNo, c:country||curCountry, m, s:1+((Math.random()*2147483646)|0), tell:pick(Object.keys(TELLS).filter(t=>t!==lastTell)), need,
    loot:houses.map((h,i)=>i).sort(()=>Math.random()-0.5).slice(0,Math.min(houses.length,need+2)), k};
}

/* ---------- online: the room's host runs the village, bots and rules; every player moves their own
   character locally and sends position + actions as "presence"; the host shares the world 10 times a
   second (snapshot + recent events). Two transports give the same peers()/presence() interface:

   - Claude's room capability: a fallback when the game runs inside Claude and PeerJS can't connect. ---------- */

function netTick(dt){

  if(!$('online').hidden){ NET.uiT-=dt; if(NET.uiT<=0){ NET.uiT=0.4; renderRoom(); } }
  if(NET.mode==='host'){
    /* Claude room only: two players pressed the same room at once — the lower id keeps hosting */
    if(roomApi.kind!=='peer'&&game.state==='lobby'){ const h=hostPeer(); if(h&&!h.sameTab){ NET.mode='client'; roomApi.presence({h:null}).catch(()=>{}); renderRoom(); return; } }
    if(NET.sendT<=0){ NET.sendT=0.1; if(game.r&&NET.su) roomApi.presence({su:NET.su,gs:hostSnap()}).catch(()=>{}); }
    return;
  }
  const h=hostPeer();
  if(!h){ if(!NET.hostGone) NET.hostGone=now; if(now-NET.hostGone>6&&now-NET.joinedAt>6) leaveRoom(NET.round||NET.pub?'on.hostLeft':'on.notFound'); return; }
  NET.hostGone=0; /* wall-clock seconds since the host vanished, so slow frames can't stretch the wait */
  const hc=h.presence.c; /* private rooms: show the host's country while waiting */
  if(game.state==='lobby'&&typeof hc==='string'&&COUNTRY[hc]&&hc!==curCountry){ setCountry(hc); NET.country=hc; spawnCrowd(); }
  if(h.presence!==NET.lastHostPres){ NET.lastHostPres=h.presence; clientApply(h.presence); }
  if(NET.sendT<=0){
    if(player&&game.r){ NET.sendT=0.066; const e=player;
      roomApi.presence({p:[Math.round(e.pos.x*20),Math.round(e.pos.z*20),Math.round(e.heading*100),(e.moving?1:0)|(e.running?2:0)],a:NET.acts}).catch(()=>{}); }
    else { NET.sendT=0.5; roomApi.presence({a:NET.acts}).catch(()=>{}); }
  }
}

let last=performance.now();
/* one simulation step (dt ≤ 0.05 s) */
function step(dt,now){
  if(game.state==='reveal'){game.revealT-=dt; if(game.revealT<=0){game.state='play';$('reveal').hidden=true;}}
  const live=game.state==='play';
  if(live&&game.time<=10){const sec=Math.ceil(game.time); if(sec!==game.lastSec){game.lastSec=sec; if(sec>0) S.play('count');}}
  if(live){game.time-=dt; if(game.time<=0){game.time=0; if(NET.mode!=='client') endRound('thieves','time');}}
  netTick(dt); simulate(dt,game.state==='play',now); tickParticles(dt); tickCeleb(dt,now); tickKeepers(dt,now); ambient.tick(dt,now);
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.hidden=true;}
}
/* slow phones: catch up in small steps (up to 0.25 s per frame) instead of running in slow motion */
function advance(t,cap){
  let el=Math.min(cap,Math.max(0,(t-last)/1000)); last=t; const now=t/1000;
  while(el>1e-4){ const d=Math.min(0.05,el); step(d,now); el-=d; }
}
function frame(t){
  requestAnimationFrame(frame);
  const fd=Math.min(0.25,Math.max(0,(t-last)/1000)); advance(t,0.25); updateCamera(fd,false); updateHUD();
  renderer.render(scene,camera);
}
